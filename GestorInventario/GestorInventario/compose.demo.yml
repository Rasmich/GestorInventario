name: gestorinventario-demo
services:
  mysql-demo:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gestor_inventario_demo
      MYSQL_USER: demo_app
      MYSQL_PASSWORD: ${DEMO_DB_PASSWORD:?Define una contrasena nueva exclusiva para demo}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-demo-data:/var/lib/mysql
    networks:
      - demo-interna
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  app-demo:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEMO_DB_URL: jdbc:mysql://mysql-demo:3306/gestor_inventario_demo
      DEMO_DB_USERNAME: demo_app
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:?Define una contrasena nueva exclusiva para demo}
      DEMO_JWT_SECRET: ${DEMO_JWT_SECRET:?Define un secreto nuevo en Base64 de al menos 32 bytes}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Define la contrasena del administrador de demo}
      DEMO_EMPLOYEE1_PASSWORD: ${DEMO_EMPLOYEE1_PASSWORD:?Define la contrasena del empleado 1}
      DEMO_EMPLOYEE2_PASSWORD: ${DEMO_EMPLOYEE2_PASSWORD:?Define la contrasena del empleado 2}
      DEMO_EMPLOYEE3_PASSWORD: ${DEMO_EMPLOYEE3_PASSWORD:?Define la contrasena del empleado 3}
      PORT: "8080"
    depends_on:
      mysql-demo:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8080"
    networks:
      - demo-interna
      - demo-web
networks:
  demo-web:
  demo-interna:
    internal: true
volumes:
  mysql-demo-data:
