# Activacion explicita: --spring.profiles.active=demo
# Sin valores alternativos: la demo requiere su propia configuracion.
spring.datasource.url=${DEMO_DB_URL}
spring.datasource.username=${DEMO_DB_USERNAME}
spring.datasource.password=${DEMO_DB_PASSWORD}
jwt.secret=${DEMO_JWT_SECRET}
jwt.expiration=${DEMO_JWT_EXPIRATION:3600000}
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never

server.address=0.0.0.0
